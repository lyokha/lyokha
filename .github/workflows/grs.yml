name: Update README cards

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&count_private=true&include_all_commits=true&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=10&hide=CMake,Makefile,HTML
          path: profile/top-langs.svg
          token: ${{ secrets.PAT_TOKEN }}

      - name: Generate trophy card
        run: |
          options='&column=8&title=-Followers,-Reviews'
          backends="https://github-profile-trophy.vercel.app "`
                  `"https://github-profile-trophy-fork-two.vercel.app "`
                  `"https://github-profile-trophy-winning.vercel.app "`
                  `"https://github-profile-trophy-kannan.vercel.app "`
                  `"https://trophy.ryglcloud.net "`
                  `"https://github-profile-trophy-tawny.vercel.app "`
                  `"https://github-profile-repo.vercel.app "`
                  `"https://gh-trophy.cdnsoft.net"
          res=fail
          for backend in $backends
          do
              if wget "$backend/?username=${{ github.repository_owner }}$options" -O profile/trophy.svg
              then
                  res=success
                  break
              fi
          done
          [ "$res" = success ]

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push

